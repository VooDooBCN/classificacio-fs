<!DOCTYPE html>
<html lang='ca'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aleví A - Plantilla | Futbol Sala Parets</title>
  <link rel="stylesheet" href="style.css">
  <!-- Tipus de lletra i icones (igual que a index.html) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body class="subpage">

<div id="header-container"></div>

<main>

  <div class="container">
    <h2>Classificació Lliga Divisió d'Honor Catalana Grup 1</h2>

    <div class="table-responsive">
      <table class="standings">
        <thead>
          <tr>
            <th>Posició</th>
            <th>Equip</th>
            <th>Pts</th>
            <th>J</th>
            <th>G</th>
            <th>E</th>
            <th>P</th>
            <th>F</th>
            <th>C</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="sponsors-container"></div>

</main>

<script>
async function carregarClassificacio() {
  try {
    const res = await fetch("http://localhost:3000/api/classificacio");
    const data = await res.json();

    const tbody = document.querySelector(".standings tbody");
    tbody.innerHTML = "";

    data.forEach(equip => {

      const esParets = equip.team.toLowerCase().includes("parets");

      const fila = `
        <tr class="${esParets ? 'parets' : ''}">
          <td>${equip.pos}</td>
          <td class="team">
           <img src="${equip.logo}" class="escut">
           ${equip.team}
          </td>
          <td>${equip.pts}</td>
          <td>${equip.j}</td>
          <td>${equip.g}</td>
          <td>${equip.e}</td>
          <td>${equip.p}</td>
          <td>${equip.f}</td>
          <td>${equip.c}</td>
        </tr>
      `;

      tbody.innerHTML += fila;
    });

  } catch (err) {
    console.error("Error carregant dades", err);
  }
}

carregarClassificacio();
setInterval(carregarClassificacio, 60000);
</script>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span id="any-actual"></span> Futbol Sala Parets</p>

    <a class="footer-ajuntament" href="https://www.parets.cat/" target="_blank" rel="noopener">
      <img src="img/Ajuntament-Parets-BN.png" alt="Ajuntament de Parets del Vallès">
    </a>
  </div>
</footer>
  
<div class="footer-spacer"></div>

<script>
  // Any actual al peu
  const any = document.getElementById('any-actual');
  if (any) {
    any.textContent = new Date().getFullYear();
  }
</script>
  
<script src="js/carrusel.js"></script>
<script src="js/cookies.js"></script>
<script src="js/header.js"></script>
  
<script>
const lang = document.documentElement.lang || "ca";

/* HEADER */
fetch(lang === "es" 
  ? "components/header-es.html" 
  : "components/header-cat.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header-container").innerHTML = data;

    setTimeout(() => {
      initHeader();
    }, 50);
  });

/* SPONSORS */
fetch("components/sponsors.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("sponsors-container").innerHTML = data;

    setTimeout(() => {
      initCarousel();
    }, 50);
  });
</script>
</body>
</html>
