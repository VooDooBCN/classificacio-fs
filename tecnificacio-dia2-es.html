<!-- ✅ SCRIPT LIGHTBOX (AFEGIT AQUÍ) -->

<script>
let currentIndex = 0;
let images = [];

const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const closeBtn = document.querySelector(".lightbox-close");
const prevBtn = document.querySelector(".lightbox-prev");
const nextBtn = document.querySelector(".lightbox-next");

// actualitzar imatges
function updateImages() {
    images = document.querySelectorAll("#gallery img");
}

// obrir
function openLightbox(index) {
    updateImages();
    currentIndex = index;
    lightbox.style.display = "flex";
    lightboxImg.src = images[currentIndex].src;
}

// assignar click
function attachClick(img, index) {
    img.addEventListener("click", () => {
        openLightbox(index);
    });
}

// tancar
closeBtn.onclick = () => {
    lightbox.style.display = "none";
};

// clicar fora
lightbox.onclick = (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
    }
};

// següent
if (nextBtn && prevBtn) {

    nextBtn.onclick = () => {
        updateImages();
        if (currentIndex < images.length - 1) {
    currentIndex++;
    lightboxImg.src = images[currentIndex].src;
} else {
    // si estem a l'última → carregar més
    if (loaded < totalImages) {
        loadImages();

        // petit delay perquè carregui
        setTimeout(() => {
            updateImages();
            currentIndex++;
            lightboxImg.src = images[currentIndex].src;
        }, 300);
    }
}
    };

// anterior
    prevBtn.onclick = () => {
        updateImages();
        if (currentIndex > 0) {
            currentIndex--;
            lightboxImg.src = images[currentIndex].src;
        }
    };

}

document.addEventListener("keydown", (e) => {

    // només si el lightbox està obert
    if (lightbox.style.display === "flex") {

        if (e.key === "ArrowRight") {
            nextBtn.click();
        }

        if (e.key === "ArrowLeft") {
            prevBtn.click();
        }

        if (e.key === "Escape") {
            lightbox.style.display = "none";
        }

    }

});
let startX = 0;
let endX = 0;

lightbox.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend", (e) => {
    endX = e.changedTouches[0].clientX;

    handleSwipe();
});

function handleSwipe() {
    const diff = startX - endX;

    // llindar mínim (important)
    if (Math.abs(diff) > 50) {

        if (diff > 0) {
            // swipe esquerra → següent
            nextBtn.click();
        } else {
            // swipe dreta → anterior
            prevBtn.click();
        }

    }
}

</script>

<script>
const totalImages = 171;
const imagesPerLoad = 15;
let loaded = 0;

const gallery = document.getElementById("gallery");
const btn = document.getElementById("loadMore");

function loadImages() {

    // 🔹 indicador de càrrega
    btn.textContent = "Cargando...";
    btn.disabled = true;

    setTimeout(() => {

        for (let i = loaded + 1; i <= loaded + imagesPerLoad && i <= totalImages; i++) {
            const img = document.createElement("img");
            img.src = `img/tec2/dia2-${i}.jpg`;
            img.loading = "lazy";
            img.decoding = "async";
            img.fetchPriority = "low";

            attachClick(img, i - 1);

            gallery.appendChild(img);
        }

        loaded += imagesPerLoad;

        if (loaded >= totalImages) {
            btn.textContent = "No hay más imágenes";
            btn.disabled = true;
        } else {
            btn.textContent = "Cargar más imágenes";
            btn.disabled = false;
        }

        // 🔹 scroll suau
        window.scrollBy({
            top: 300,
            behavior: "smooth"
        });

    }, 300);
}

// carregar inicial
loadImages();

btn.addEventListener("click", loadImages);
</script>
